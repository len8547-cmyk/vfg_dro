  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #02060d;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  /* 화면 크기에 맞춰 1300x680 비율 그대로 축소/확대 */
  #wrap {
    position: absolute; left: 50%; top: 50%;
    width: 1300px; height: 680px;
    margin: -340px 0 0 -650px;
    transform-origin: 50% 50%;
  }
  #stage {
    position: relative; width: 1300px; height: 680px;
    background: url("img/bg.jpg") no-repeat 0 0 / 1300px 680px;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  /* PSD 텍스트 레이어: 60px / 자간 -25 / #96F4FF / 가운데 정렬
     기준점 x=767, 932, 1096 · 베이스라인 y≈351 */
  .num {
    position: absolute; top: 295px;
    width: 120px; margin-left: -60px;
    font: 500 60px/60px "DroDigits", "Noto Sans KR", "Malgun Gothic", sans-serif;
    letter-spacing: -0.025em;
    color: #96f4ff;
    text-align: center;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #hh { left: 767px; }
  /* 시간이 4자리 이상이면 박스(약 126px) 안에 들어오도록 축소 */
  #hh.d4 { font-size: 48px; }
  #hh.d5 { font-size: 39px; }
  #mm { left: 932px; }
  #ss { left: 1096px; }
  /* 자세히 보기 버튼 클릭 영역 (754,524 ~ 1118,598) */
  #btn {
    position: absolute; left: 754px; top: 524px;
    width: 364px; height: 74px;
    border-radius: 12px;
    transition: box-shadow .2s, background-color .2s;
  }
  #btn:hover { background-color: rgba(150, 244, 255, .08); box-shadow: 0 0 24px rgba(120, 200, 255, .45); }
  #btn:active { background-color: rgba(150, 244, 255, .16); }
  .blind { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <h1 class="blind">드로이얀M 정식 오픈 준비 중 - 정식 오픈까지 남은 시간</h1>
    <div class="num" id="hh" aria-label="시간">000</div>
    <div class="num" id="mm" aria-label="분">00</div>
    <div class="num" id="ss" aria-label="초">00</div>
    <a id="btn" href="#" target="_blank" rel="noopener"><span class="blind">자세히 보기</span></a>
  </div>
</div>

<script>
  /* ===================== 설정 (여기만 수정) ===================== */
  var CONFIG = {
    // 정식 오픈 일시 (한국시간 KST, +09:00 고정)
    OPEN_AT: "2027-01-19T11:00:00+09:00",
    // '자세히 보기' 버튼 링크
    DETAIL_URL: "https://cafe.naver.com/droiyanmofficial",
    // 서버 시간 기준으로 맞추려면 서버가 내려준 현재시각(ms)을 넣으세요. null이면 기기 시각 사용
    SERVER_NOW_MS: null
  };
  /* ============================================================ */

  (function () {
    var target = new Date(CONFIG.OPEN_AT).getTime();
    var offset = CONFIG.SERVER_NOW_MS ? CONFIG.SERVER_NOW_MS - Date.now() : 0;
    var elH = document.getElementById("hh");
    var elM = document.getElementById("mm");
    var elS = document.getElementById("ss");
    var btn = document.getElementById("btn");
    btn.href = CONFIG.DETAIL_URL;

    function pad(n, len) { n = String(n); while (n.length < len) n = "0" + n; return n; }

    var timer;
    function tick() {
      var left = Math.max(0, Math.floor((target - (Date.now() + offset)) / 1000));
      var h = Math.floor(left / 3600);        // 일(day) 단위 없이 전체 시간으로 표기 (예: 123)
      var m = Math.floor((left % 3600) / 60);
      var s = left % 60;
      var hs = pad(h, 2);
      elH.textContent = hs;
      elH.className = "num" + (hs.length >= 5 ? " d5" : hs.length === 4 ? " d4" : "");
      elM.textContent = pad(m, 2);
      elS.textContent = pad(s, 2);
      if (left <= 0) { clearTimeout(timer); return; }   // 종료 시 00:00:00 고정
      timer = setTimeout(tick, 1000 - ((Date.now() + offset) % 1000) + 5);
    }
    tick();
    // 앱이 백그라운드에서 돌아왔을 때 즉시 갱신
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { clearTimeout(timer); tick(); }
    });

    // 화면 맞춤 스케일 (비율 유지, 레터박스)
    var wrap = document.getElementById("wrap");
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var k = Math.min(w / 1300, h / 680);
      wrap.style.transform = "scale(" + k + ")";
      wrap.style.webkitTransform = "scale(" + k + ")";
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });
  })();
</script>
</body>
